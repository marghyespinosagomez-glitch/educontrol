<div class="d-flex ">
    <p class="mb-0">Grados</p>
    <button type="button" class="btn btn-primary ms-auto" data-bs-toggle="modal" data-bs-target="#nuevoGrado">+ Crear</button>
</div>
<div class="row g-3">
    
    <div class="col-md-2">
        <label class="form-label">Jornada</label>
        <select class="form-select" id="filtroJornada">
            <option value="">Todos</option>
            <option value="1">Mañana</option>
            <option value="2">Tarde</option>
        </select>
    </div>

    <div class="col-md-2">
        <label class="form-label">Grado</label>
        <select class="form-select" id="filtroGrado">
            <option value="">Todos</option>
            <option value="1">Transición</option>
            <option value="2">Primero</option>
            <option value="3">Segundo</option>
            <option value="4">Tercero</option>
            <option value="5">Cuarto</option>
            <option value="6">Quinto</option>
            <option value="7">Sexto</option>
            <option value="8">Septimo</option>
            <option value="9">Octavo</option>
            <option value="10">Noveno</option>
            <option value="11">Décimo</option>
            <option value="12">Once</option>
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Asignatura</label>
        <select class="form-select" id="filtroAsignatura">
            <option value="">Todas</option>
            <option value="matematicas">Matemáticas</option>
            <option value="lengua">Lengua</option>
            <option value="ciencias">Ciencias</option>
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Bloque</label>
        <select class="form-select" id="filtroBloque">
            <option value="">Todos</option>
            <option value="1">Bloque 1</option>
            <option value="2">Bloque 2</option>
            <option value="3">Bloque 3</option>
            <option value="4">Bloque 4</option>
            <option value="5">Bloque 5</option>
            <option value="6">Bloque 6</option>
        </select>
    </div>

</div>
<table class="tabla" style="margin-top: 10px;">
    <thead>
        <tr >
            <th style="width: 5%;">Item</th>
            <th style="width: 10%;">Grado</th>
            <th style="width: 38%;">Director</th>
            <th style="width: 20%;">Materias</th>
            <th style="width: 10%;">Dias</th>
            <th style="width: 10%;">Bloques</th>
            <th style="width: 7%;">Acción</th>
        </tr>
    </thead>
    <tbody id="tabla-grado-admin">
        
    </tbody>
</table>

<div class="modal fade" id="nuevoGrado" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLabel">Agregar Grado</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formAggGrado">
                    <input type="hidden" id="aggGrado" name="aggGrado">
                    
                    <div class="">
                        <label for="grado" class="form-label">Asignar Grado</label>
                        <div class="row">
                            <div class="col-6">
                                <select class="form-control mb-2"  name="grado" id="grado" required>
                                    <option value="" disabled selected>Seleccionar Grado</option>
                                    <option value="1">Transición</option>
                                    <option value="2">Primero</option>
                                    <option value="3">Segundo</option>
                                    <option value="4">Tercero</option>
                                    <option value="5">Cuarto</option>
                                    <option value="6">Quinto</option>
                                    <option value="7">Sexto</option>
                                    <option value="8">Septimo</option>
                                    <option value="9">Octavo</option>
                                    <option value="10">Noveno</option>
                                    <option value="11">Décimo</option>
                                    <option value="12">Once</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <select class="form-control" name="letra" id="letra" required>
                                    <option value="" disabled selected>Seleccionar Letra</option>
                                    <option value="A" >A</option>
                                    <option value="B" >B</option>
                                    <option value="C" >C</option>
                                    <option value="D" >D</option>
                                    <option value="E" >E</option>
                                    <option value="F" >F</option>
                                    <option value="G" >G</option>
                                    <option value="H" >H</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="">
                        <label for="namedirec" class="form-label">Nombre director</label>
                        <select class="form-control" name="namedirec" id="namedirec" required>
                            <option value="" disabled selected>Seleccionar Director</option>
                            <option value="A" >Andres Parra</option>
                            <option value="B" >Brandon Pelaez</option>
                            <option value="C" >Cesar Fiaga</option>
                            <option value="D" >Deutoronomio Casas</option>
                            <option value="E" >Enrique Nieto</option>
                            <option value="F" >Francisco Popayab</option>
                            <option value="G" >Gregorio Quijano</option>
                            <option value="H" >Hamilton Yuseef</option>
                        </select>
                    </div>
                    <div class="asignar">
                        <div class="">
                            <label for="matter" class="form-label">Asignaturas</label>
                            <select class="form-control" name="matter" id="matter">
                                <option value="" disabled selected>Seleccionar Asignatura</option>
                                <option value="A" >Sociales</option>
                                <option value="B" >Biología</option>
                                <option value="C" >Computación</option>
                                <option value="D" >Deportes</option>
                                <option value="E" >Español</option>
                                <option value="F" >Filosofía</option>
                            </select>
                        </div>
                        <div class="">
                            <label for="day" class="form-label">Asignar Día</label>
                            <div class="row" id="dias">
                                <div class="col-6">
                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="Lunes" id="day1" name="day">
                                        <label class="form-check-label" for="day1">
                                            Lunes
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="Martes" id="day2" name="day">
                                        <label class="form-check-label" for="day2">
                                            Martes
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="Miercoles" id="day3" name="day">
                                        <label class="form-check-label" for="day3">
                                            Miercoles
                                        </label>
                                    </div>
                                </div>

                                <div class="col-6">
                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="Jueves" id="day4" name="day">
                                        <label class="form-check-label" for="day4">
                                            Jueves
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="Viernes" id="day5" name="day">
                                        <label class="form-check-label" for="day5">
                                            Viernes
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="">
                            <label for="block" class="form-label">Asignar Bloque</label>
                            <div class="row" id="blocks">
                                <div class="col-6">
                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="bloque 1" id="block1" name="block">
                                        <label class="form-check-label" for="block1">
                                            Bloque 1
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="bloque 2" id="block2" name="block">
                                        <label class="form-check-label" for="block2">
                                            Bloque 2
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="bloque 3" id="block3" name="block">
                                        <label class="form-check-label" for="block3">
                                            Bloque 3
                                        </label>
                                    </div>
                                </div><div class="col-6">
                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="bloque 4" id="block4" name="block">
                                        <label class="form-check-label" for="block4">
                                            Bloque 4
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="bloque 5" id="block5" name="block">
                                        <label class="form-check-label" for="block5">
                                            Bloque 5
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input materia" type="checkbox" value="bloque 6" id="6" name="block">
                                        <label class="form-check-label" for="block6">
                                            Bloque 6
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" id="btnAgregar" class="btn btn-primary ms-auto">+ Materia</button>
                        <div id="materiasAgregadas"></div>
                    </div>
                    <button type="submit" class="btn btn-success mt-3">Crear</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="/front/js/grados.js"></script>
